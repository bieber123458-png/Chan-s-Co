# Render 一鍵部署設定（小陳的 30 天經營系統，程式在 app/ 資料夾）
# 使用方式見 app/DEPLOY.md
services:
  - type: web
    name: xiaochen-30-day-system
    runtime: node
    rootDir: app
    # 需要持久化磁碟保存 SQLite 資料庫，因此使用付費的 starter 方案（免費方案重啟後資料會消失）
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    # AI 金鑰非必要：部署後如果想用 AI，再到 Render 的 Environment 新增 ANTHROPIC_API_KEY
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_PATH
        value: /var/data/app.db
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: AI_MODEL
        value: claude-opus-5-5
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
